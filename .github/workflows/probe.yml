name: probe
on: { workflow_dispatch: {} }
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for i in $(seq 1 10); do
            if out=$(curl -sS -m 20 -i -H "origin: https://hasagoodnight-prog.github.io" "https://kyms-live.hasagoodnight.workers.dev/?s=00919,T00" 2>&1); then
              echo "try $i OK"; echo "$out" | sed -n '1p;/access-control-allow-origin/Ip;$p'; exit 0
            fi
            echo "try $i: $(echo "$out" | tail -1)"; sleep 30
          done
          exit 1
