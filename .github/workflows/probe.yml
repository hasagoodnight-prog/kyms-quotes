name: probe
on: { workflow_dispatch: {} }
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -sS -m 30 "https://api.finmindtrade.com/api/v4/data?dataset=TaiwanStockDividend&data_id=00919&start_date=2024-06-01" \
          | python3 -c "import sys,json; d=json.load(sys.stdin); [print('ROW', r['date'], 'ex', r['CashExDividendTradingDate'], 'pay', r['CashDividendPaymentDate'], 'cash', r['CashEarningsDistribution'], r['CashStatutorySurplus'], 'ann', r['AnnouncementDate']) for r in d.get('data',[])]; print('msg', d.get('msg'))"
