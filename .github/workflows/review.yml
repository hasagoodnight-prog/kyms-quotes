name: 每月月報分析

on:
  schedule:
    # UTC 01:07 = 台灣時間 09:07，每月 1 日，分析上個月
    - cron: "7 1 1 * *"
  workflow_dispatch:
    inputs:
      model:
        description: "模型 id（留空＝預設 openai/gpt-4.1）"
        required: false
      month:
        description: "要分析的月份（YYYY-MM），留空＝上個月"
        required: false
      force:
        description: "已經有分析也重寫"
        type: boolean
        default: false
      list_models:
        description: "只列出可以用的模型，不寫分析"
        type: boolean
        default: false

permissions:
  contents: read
  models: read

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: node review-month.mjs
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MODEL: ${{ inputs.model || vars.REVIEW_MODEL }}
          MONTH: ${{ inputs.month }}
          FORCE: ${{ inputs.force && '1' || '' }}
          LIST_MODELS: ${{ inputs.list_models && '1' || '' }}
