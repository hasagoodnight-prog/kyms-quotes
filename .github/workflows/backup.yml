name: 每週加密備份

on:
  schedule:
    # UTC 19:23 星期六 = 台灣時間星期日 03:23
    - cron: "23 19 * * 6"
  workflow_dispatch: {}

# 要把加密檔推到 backups 分支
permissions:
  contents: write

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: 匯出並加密
        id: enc
        run: |
          f="kyms-$(TZ=Asia/Taipei date +%Y-%m-%d).json.age"
          node backup.mjs "$RUNNER_TEMP/$f"
          if [ -f "$RUNNER_TEMP/$f" ]; then echo "file=$f" >> "$GITHUB_OUTPUT"; fi
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      - name: 存到 backups 分支（保留最近 52 份）
        if: steps.enc.outputs.file != ''
        run: |
          f="${{ steps.enc.outputs.file }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git fetch --depth 1 origin backups 2>/dev/null; then
            git checkout -q -B backups FETCH_HEAD
          else
            git checkout -q --orphan backups
            git rm -rq --cached . && find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
            printf '# 加密備份\n\n每週自動產生，用 age 加密。只有持有私鑰的人能解開。\n解密：打開網站上的 backup.html。\n' > README.md
            git add README.md
          fi
          mkdir -p backups
          cp "$RUNNER_TEMP/$f" "backups/$f"
          ls -1 backups/*.age | sort | head -n -52 | xargs -r git rm -q
          git add backups
          git commit -q -m "備份 $f"
          git push -q origin backups
          echo "已存到 backups 分支：$f"
